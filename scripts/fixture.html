<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Fixture Claude Code Bridge</title>
    <style>
      body { font: 14px system-ui; margin: 24px; }
      .cache { display: none; }
      .invisible { visibility: hidden; }
      iframe { width: 300px; height: 120px; border: 1px solid #ccc; }
    </style>
  </head>
  <body>
    <header>
      <a href="/accueil">Accueil</a>
      <a href="https://exemple.test/externe">Site externe</a>
    </header>

    <main>
      <h1>Rapport de ventes</h1>
      <p>Total du mois : 12 480 EUR</p>

      <form>
        <label for="email">Adresse e-mail</label>
        <input id="email" name="email" type="email" value="a@b.test" required />

        <input type="text" name="recherche" placeholder="Rechercher un client" />

        <label><input type="checkbox" name="archive" checked /> Inclure les archives</label>

        <select name="periode" aria-label="Periode">
          <option value="7j">7 derniers jours</option>
          <option value="30j" selected>30 derniers jours</option>
        </select>

        <button type="submit">Exporter</button>
        <button type="button" disabled>Supprimer</button>
      </form>

      <div role="button" tabindex="0" aria-expanded="false">Menu personnalise</div>

      <p class="cache">Texte masque par display none</p>
      <p class="invisible">Texte masque par visibility hidden</p>
      <p aria-hidden="true">Texte masque par aria-hidden</p>

      <table>
        <tr><th>Client</th><th>Montant</th></tr>
        <tr><td>Dupont</td><td>3 200 EUR</td></tr>
      </table>

      <iframe src="fixture-frame.html" title="Encart partenaire"></iframe>
    </main>

    <script src="../extension/page-agent.js"></script>
  </body>
</html>
